[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (unused imports, undefined names)
    "B",     # flake8-bugbear (common bugs)
    "SIM",   # flake8-simplify (code simplification)
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",    # line too long (we set 120)
    "SIM108",  # use ternary instead of if-else
    "RUF003",  # Hebrew characters in comments (false positive for Hebrew codebase)
]

[tool.ruff.lint.per-file-ignores]
"test_entry_monitor.py" = ["F841"]  # unused variables in tests
"daily_review.py" = ["E722"]  # bare except OK for yfinance fallback
"entry_monitor.py" = ["E722"]  # bare except OK for API fallback

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["."]
python_files = "test_*.py"
addopts = "-v --tb=short"